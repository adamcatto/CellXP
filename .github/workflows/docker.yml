name: docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "infra/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "infra/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f infra/compose/docker-compose.yml config --quiet
