name: evals
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
jobs:
  eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: make eval-smoke
