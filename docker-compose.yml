services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cellxp
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # Local reasoning LLM (agent brain) — see specs/services/llm_service.md
  # After first start, pull a model: `docker compose exec ollama ollama pull $LLM_MODEL`
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  ollama:
