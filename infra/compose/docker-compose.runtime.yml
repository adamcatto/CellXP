services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: cellxp/api:0.1.0
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      RUNTIME_BACKEND: queued
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/cellxp
      REDIS_URL: redis://redis:6379/0
      GRAPH_JOB_STREAM: cellxp:graph-commands
      GRAPH_CONSUMER_GROUP: cellxp-graph-executors
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  graph-executor:
    image: cellxp/api:0.1.0
    restart: unless-stopped
    command: ["python", "-m", "cellxp.jobs.graph_worker"]
    environment:
      RUNTIME_BACKEND: durable
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/cellxp
      REDIS_URL: redis://redis:6379/0
      GRAPH_JOB_STREAM: cellxp:graph-commands
      GRAPH_CONSUMER_GROUP: cellxp-graph-executors
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cellxp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cellxp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
