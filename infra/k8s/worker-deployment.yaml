apiVersion: apps/v1
kind: Deployment
metadata:
  name: cellxp-structure-worker
  labels:
    app.kubernetes.io/name: cellxp-structure-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cellxp-structure-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cellxp-structure-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: structure-worker
          image: cellxp/structure-worker:boltz-2.2.1-esmfold-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8102
          env:
            - name: STRUCTURE_DEVICE
              value: cuda
            - name: STRUCTURE_JOB_TIMEOUT_SECONDS
              value: "1800"
            - name: MODEL_CACHE_DIR
              value: /models
            - name: ESMFOLD_REVISION
              value: 75a3841ee059df2bf4d56688166c8fb459ddd97a
            - name: OBJECT_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: cellxp-runtime
                  key: object-store-url
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: cellxp-structure-models
---
apiVersion: v1
kind: Service
metadata:
  name: cellxp-structure-worker
spec:
  selector:
    app.kubernetes.io/name: cellxp-structure-worker
  ports:
    - name: http
      port: 8102
      targetPort: http
