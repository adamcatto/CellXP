[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellxp"
version = "0.1.0"
description = "CellXP: LangGraph genome AI copilot."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "redis>=5",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/backend", "."]
markers = [
    "unit: T1 fast deterministic tests",
    "integration: T2 graph and service integration",
    "contract: T3 OpenAPI and client compatibility",
    "e2e: T4 backend end-to-end",
    "browser: T5 Playwright browser end-to-end",
    "slow: exceeds the pull-request time budget",
    "eval: T6 golden-query evaluation",
    "gpu: requires a GPU",
    "live: calls live external services",
]
